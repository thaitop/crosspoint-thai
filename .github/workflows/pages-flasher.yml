name: Deploy Web Flasher

# Publish web-flasher/ with the latest stable th-* release firmware to GitHub
# Pages. Browsers cannot fetch release assets directly (no CORS), so the bins
# are served from Pages next to the manifests. release-thai.yml calls this
# after it has attached every device's firmware.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Site files come from the default branch, so a th-* tag on any branch
      # only needs to carry the release assets.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Pick release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --json tagName -q '[.[] | select(.tagName | startswith("th-"))][0].tagName')"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p _site/images
          cp web-flasher/index.html web-flasher/style.css web-flasher/flasher.js web-flasher/partitions.js web-flasher/favicon.svg web-flasher/devices.json _site/
          cp -R web-flasher/fonts _site/
          cp docs/images/thai/*.png web-flasher/images/*.png _site/images/
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.bin' -D _site
          python3 web-flasher/assemble.py _site "$TAG"

      - name: Check site
        run: python3 web-flasher/check_site.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

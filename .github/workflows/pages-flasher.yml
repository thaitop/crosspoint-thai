name: Deploy Web Flasher

# Publish web-flasher/ with the latest th-* release firmware to GitHub Pages.
# Browsers cannot fetch release assets directly (no CORS), so the bins are
# served from Pages next to the manifests.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'th-')
    runs-on: ubuntu-latest
    steps:
      # Site files come from the default branch, so a th-* tag on any branch
      # only needs to carry the release assets.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Pick release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$EVENT_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
              --json tagName -q '[.[] | select(.tagName | startswith("th-"))][0].tagName')"
          fi
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p _site/images
          cp web-flasher/index.html web-flasher/style.css web-flasher/favicon.svg web-flasher/*.json _site/
          cp -R web-flasher/fonts _site/
          cp docs/images/thai/*.png _site/images/
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.bin' -D _site
          for device in x4pro eink4plus; do
            python3 web-flasher/split_factory.py "_site/$device-firmware.factory.bin" "_site/$device"
          done
          rm _site/*-firmware.factory.bin _site/eink4plus-firmware.bin
          sed -i "s/\"version\": \"dev\"/\"version\": \"$TAG\"/" _site/x4pro.json _site/eink4plus.json

      - name: Check site
        run: python3 web-flasher/check_site.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
